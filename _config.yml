# Grundeinstellungen. Nach Änderungen an dieser Datei Jekyll neu starten.
title: Swing zu Hauf
description: Ein Bruder-Projekt für Live-Swing und Social Dance.
lang: de
timezone: Europe/Berlin

# Später die echte Domain eintragen, z. B. https://swing-zu-hauf.eu
url: "https://grummelgans.github.io"
# Bei einer Projektseite auf GitHub (nutzername.github.io/repo) hier "/repo" eintragen.
# Bei eigener Domain oder nutzername.github.io leer lassen.
baseurl: "/swing-zu-hauf"

# Kontakt (Namen der Brüder stehen jetzt in _data/texte.yml und _personen/)
email: jlhauf.info@gmail.com

# Events: pro Abend eine Datei in _events/. Personen: pro Person eine Datei in _personen/
collections:
  events:
    output: true
    permalink: /events/:name/
  personen:
    output: true
    permalink: /personen/:name/

# WICHTIG: ohne "future: true" werden Events mit Datum in der Zukunft nicht angezeigt
future: true

# Layouts automatisch zuweisen
defaults:
  - scope: { path: "", type: "events" }
    values: { layout: event }
  - scope: { path: "", type: "personen" }
    values: { layout: person }

exclude: [README.md, Gemfile, Gemfile.lock, vendor]