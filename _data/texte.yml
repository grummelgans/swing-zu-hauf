# Zwischenseiten hinter "Da komme doch direkt!"
dabei_zurueck: "Zurück zum Abend"
dabei:
  vorverkauf:
    titel: "Super, dass du dabei bist!"
    absaetze:
      - "Hier geht's direkt zu den Online-Tickets für diesen Abend."
    ticket_link: "Zu den Online-Tickets"
    ticket_fehler: "Der Link zu den Online-Tickets konnte nicht geladen werden. Geh bitte zurück zum Abend und versuche es dort noch einmal."
  abendkasse:
    titel: "Keine Tickets im Voraus? Genau so ist es."
    absaetze:
      - "Für diesen Abend gibt es keinen Vorverkauf. Das ist kein Versehen, sondern Absicht: Du kommst einfach vorbei, und die Tickets gibt es direkt vor Ort an der Abendkasse."
      - "Damit der Abend mit Tanzen beginnt und nicht mit Warten, komm am besten etwas früher. Bargeld ist an Abendkassen im Zweifel die sicherste Wahl. Und die bequemen Schuhe nimmst du am besten gleich mit."
      - "Preis und Einlass stehen auf der Seite des Abends im Abschnitt „Kurz und knapp“. Wir freuen uns auf dich."
  frei:
    titel: "Eintritt frei. Wirklich."
    absaetze:
      - "Für diesen Abend brauchst du kein Ticket, denn es gibt weder Vorverkauf noch Abendkasse. Du musst nirgends klicken, nichts buchen und kein Formular ausfüllen. Einfach kommen und tanzen."
      - "Wenn du den Musiker*innen etwas Gutes tun möchtest: Spenden sind willkommen. Pflicht ist das nicht, nur ein sehr freundlicher Gedanke."
      - "Alles Weitere zu Ort und Uhrzeit steht auf der Seite des Abends. Wir freuen uns auf dich."
  offen:
    titel: "Der Ticketlink ist noch unterwegs."
    absaetze:
      - "Für diesen Abend gibt es noch keinen Ticketlink. Sobald der Vorverkauf startet, steht er hier auf der Seite des Abends, versprochen."
      - "Wer nichts verpassen möchte, [[schreibt uns kurz]], dann geben wir Bescheid. Bis dahin: Termin schon mal im Kalender freihalten und die Tanzschuhe polieren."

